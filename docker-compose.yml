version: '3.8'

networks:
  lb_network:
    driver: bridge

services:
  backend1:
    build: ./backend
    container_name: backend1
    networks:
      - lb_network

  backend2:
    build: ./backend
    container_name: backend2
    networks:
      - lb_network

  backend3:
    build: ./backend
    container_name: backend3
    networks:
      - lb_network

  loadbalancer:
    build: ./loadbalancer
    container_name: loadbalancer
    ports:
      - "8080:8080"
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - lb_network