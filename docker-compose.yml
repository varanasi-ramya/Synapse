version: '3.8'

networks:
  lb_network:
    driver: bridge

services:
  backend1:
    build: ./backend
    container_name: synapse_backend1
    environment:
      BACKEND_NAME: backend1
    ports:
      - "8001:8000"
    networks:
      - lb_network
    restart: unless-stopped

  backend2:
    build: ./backend
    container_name: synapse_backend2
    environment:
      BACKEND_NAME: backend2
    ports:
      - "8002:8000"
    networks:
      - lb_network
    restart: unless-stopped

  backend3:
    build: ./backend
    container_name: synapse_backend3
    environment:
      BACKEND_NAME: backend3
    ports:
      - "8003:8000"
    networks:
      - lb_network
    restart: unless-stopped

  loadbalancer:
    build: ./loadbalancer
    container_name: loadbalancer
    ports:
      - "8080:8080"
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - lb_network
    restart: unless-stopped